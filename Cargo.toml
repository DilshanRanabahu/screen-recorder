[workspace]
resolver = "3"
members = ["crates/recorder-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
recorder-core = { path = "crates/recorder-core" }
windows-capture = "2.0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "7"
wasapi = "0.27.0"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_FileSystem", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Power", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

# The engine does per-pixel and per-sample work; keep it fast in dev builds too.
[profile.dev.package.recorder-core]
opt-level = 2
